name: Sync skills to the docs site

# Opens (or updates) a pull request on AskWithAI/docs that copies skills/ into
# .mintlify/skills/, so `npx skills add https://docs.askwith.ai` serves the same
# skills as `npx skills add AskWithAI/skills`. Needs a DOCS_SYNC_TOKEN secret: a
# fine-grained token with Contents and Pull requests write access to AskWithAI/docs.

on:
  push:
    branches: [main]
    paths: ['skills/**', 'scripts/sync-docs.mjs']
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for the token
        id: token
        run: |
          if [ -z "${{ secrets.DOCS_SYNC_TOKEN }}" ]; then
            echo "::warning::DOCS_SYNC_TOKEN is not set; skipping the docs sync."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
        with:
          repository: AskWithAI/docs
          token: ${{ secrets.DOCS_SYNC_TOKEN }}
          path: docs-site
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
      - run: node scripts/sync-docs.mjs docs-site
        if: steps.token.outputs.ok == 'true'
      - uses: peter-evans/create-pull-request@v7
        if: steps.token.outputs.ok == 'true'
        with:
          path: docs-site
          token: ${{ secrets.DOCS_SYNC_TOKEN }}
          branch: sync/skills
          commit-message: "Sync agent skills from AskWithAI/skills@${{ github.sha }}"
          title: "Sync agent skills from AskWithAI/skills"
          body: "Copies `skills/` from AskWithAI/skills@${{ github.sha }} into `.mintlify/skills/`. Opened automatically by the skills repository's sync workflow."
          delete-branch: true
